server:
  port: 8085

spring:
  application:
    name: gateway-service
  # Valida firma y vigencia del JWT con las claves públicas del realm.
  # En Docker: http://keycloak:8080/realms/flety/protocol/openid-connect/certs (lo pasa el compose).
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8081/realms/flety/protocol/openid-connect/certs}

# Solo el health, para que Docker sepa si el Gateway está vivo.
management:
  endpoints:
    web:
      exposure:
        include: health
