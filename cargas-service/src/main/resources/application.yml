server:
  port: 8092

spring:
  application:
    name: cargas-service
  # Cada valor se puede pisar con una variable de entorno (en Docker las pasa el compose).
  # La contraseña no tiene valor por defecto a propósito: nunca va en el repo.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cargas_db}
    username: ${DB_USER:cargas}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    # Primero Hibernate crea las tablas y después corre schema-postgresql.sql (el trigger de evento_viaje).
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      platform: postgresql
      separator: "@@"
  # flety-commons valida el JWT en cada pedido (FLY-18) con las claves públicas del realm.
  # En Docker: http://keycloak:8080/realms/flety/protocol/openid-connect/certs (ver infra/keycloak/README.md).
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8081/realms/flety/protocol/openid-connect/certs}

flety:
  transporte:
    # En Docker: http://transporte-service:8091. Los timeouts tienen valor por defecto (2 s y 5 s).
    url: ${TRANSPORTE_URL:http://localhost:8091}
