# Perfil de test: base H2 en memoria, se crea al arrancar y se borra al terminar. No hace falta Postgres ni Docker.
spring:
  datasource:
    url: jdbc:h2:mem:cargas;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  # schema-postgresql.sql (el trigger de evento_viaje) es PL/pgSQL y H2 no lo entiende.
  # En los tests el append-only lo cubre la aplicación; el trigger se prueba contra el Postgres del compose.
  sql:
    init:
      mode: never
  # Con esto Spring arma el JwtDecoder sin buscar a Keycloak: las claves se piden recién cuando llega un token.
  # Los tests que mandan tokens reemplazan el decoder por TokensDePrueba, así que esta URL nunca se llama.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:1/sin-keycloak-en-tests
