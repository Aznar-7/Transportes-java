openapi: 3.1.0
info:
  title: transporte-service · contrato interno
  version: 0.1.0
  description: |
    Endpoints que cargas-service consume de transporte-service (sección 5 del diseño).
    No pasan por el Gateway: solo se llega desde la red de Docker.
    Exigen un token válido (se reenvía el del usuario) pero no verifican dueño.
    Los cuerpos son los records HabilitacionUnidadDTO y RetornoInternoDTO de flety-commons.
    Regla del M0: este contrato solo puede cambiar agregando campos.
servers:
  - url: http://transporte-service:8091
security:
  - bearer: []

paths:
  /internal/unidades/{id}/habilitacion:
    get:
      summary: Habilitación de una unidad hasta una fecha (RN-04)
      description: Flujos B y C. cargas-service la consulta al proponer y otra vez al aceptar.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: hasta
          in: query
          required: true
          description: Fin de la ventana de descarga de la carga. Los documentos tienen que estar vigentes hasta ese instante.
          schema: { type: string, format: date-time }
          example: "2026-11-05T21:00:00Z"
      responses:
        "200":
          description: La unidad existe. `habilitada` dice si puede proponer y `motivos` por qué no.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HabilitacionUnidadDTO" }
              examples:
                habilitada: { externalValue: ejemplos/habilitacion-habilitada.json }
                noHabilitada: { externalValue: ejemplos/habilitacion-no-habilitada.json }
        "400": { $ref: "#/components/responses/Invalido" }
        "401": { description: Sin token o token inválido }
        "404":
          description: La unidad no existe
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
              examples:
                noExiste: { externalValue: ejemplos/habilitacion-404.json }

  /internal/retornos/{id}:
    get:
      summary: Datos de un retorno para buscar cargas de paso (RN-01)
      description: Flujo A. Devuelve el retorno en cualquier estado; cargas-service decide qué hacer si no está PUBLICADO.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: El retorno con su ruta y los datos de la unidad
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetornoInternoDTO" }
              examples:
                conRuta: { externalValue: ejemplos/retorno.json }
                rutaAproximada: { externalValue: ejemplos/retorno-ruta-aproximada.json }
        "401": { description: Sin token o token inválido }
        "404":
          description: El retorno no existe
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
              examples:
                noExiste: { externalValue: ejemplos/retorno-404.json }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }

  responses:
    Invalido:
      description: Falta `hasta` o no es una fecha ISO-8601
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }

  schemas:
    TipoCarroceria:
      type: string
      enum: [SIDER, BATEA, TOLVA, JAULA, TERMICO, FURGON, PLATAFORMA, TANQUE]

    Ubicacion:
      type: object
      required: [provincia, localidad, lat, lng]
      properties:
        provincia: { type: string }
        localidad: { type: string }
        lat: { type: number }
        lng: { type: number }

    Coordenada:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number }
        lng: { type: number }

    HabilitacionUnidadDTO:
      type: object
      required: [unidadId, habilitada, motivos, dominio, tipoCarroceria, capacidadToneladas, capacidadM3, transportistaId, transportistaRazonSocial, transportistaTelefono]
      properties:
        unidadId: { type: integer, format: int64 }
        habilitada: { type: boolean, description: Transportista VERIFICADO y documentos obligatorios APROBADO y vigentes hasta `hasta` }
        motivos: { type: array, items: { type: string }, description: Vacío si está habilitada }
        dominio: { type: string }
        tipoCarroceria: { $ref: "#/components/schemas/TipoCarroceria" }
        capacidadToneladas: { type: number }
        capacidadM3: { type: number }
        sumaAseguradaCarga: { type: [number, "null"], description: Suma asegurada de la póliza de carga aprobada; null si no tiene (RN-06) }
        transportistaId: { type: integer, format: int64 }
        transportistaRazonSocial: { type: string }
        transportistaTelefono: { type: string }

    RetornoInternoDTO:
      type: object
      required: [id, transportistaId, unidadId, estado, origen, destino, salidaDesde, salidaHasta, desvioMaximoKm, rutaDistanciaKm, rutaDuracionMin, rutaPuntos, rutaAproximada, tipoCarroceria, capacidadToneladas, capacidadM3]
      properties:
        id: { type: integer, format: int64 }
        transportistaId: { type: integer, format: int64 }
        unidadId: { type: integer, format: int64 }
        estado: { type: string, enum: [PUBLICADO, VENCIDO, CANCELADO] }
        origen: { $ref: "#/components/schemas/Ubicacion" }
        destino: { $ref: "#/components/schemas/Ubicacion" }
        salidaDesde: { type: string, format: date-time, description: UTC }
        salidaHasta: { type: string, format: date-time, description: UTC }
        desvioMaximoKm: { type: number, description: Por defecto 30 }
        rutaDistanciaKm: { type: number, description: Si la ruta es aproximada, distancia en línea recta }
        rutaDuracionMin: { type: number, description: 0 si la ruta es aproximada }
        rutaPuntos: { type: array, items: { $ref: "#/components/schemas/Coordenada" }, description: Si la ruta es aproximada, solo origen y destino }
        rutaAproximada: { type: boolean }
        tipoCarroceria: { $ref: "#/components/schemas/TipoCarroceria" }
        capacidadToneladas: { type: number }
        capacidadM3: { type: number }

    ProblemDetail:
      type: object
      properties:
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
